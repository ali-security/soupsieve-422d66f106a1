name: build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: Optional tox environment or test selector
        required: false
        default: ''

jobs:
  tests:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        platform: [ubuntu-22.04, windows-latest]
        tox-env: [py37, py38, py39, py310, py311, nolxml, nohtml5lib]
        include:
          - tox-env: py37
            python-version: 3.7
          - tox-env: py38
            python-version: 3.8
          - tox-env: py39
            python-version: 3.9
          - tox-env: py310
            python-version: '3.10'
          - tox-env: py311
            python-version: '3.11'
          - tox-env: nolxml
            python-version: '3.11'
          - tox-env: nohtml5lib
            python-version: '3.10'
        # exclude:
        #   - platform: windows-latest
        #     tox-env: py311

    env:
      TOXENV: ${{ matrix.tox-env }}

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      if: "${{ !endsWith(matrix.python-version, '-dev') }}"
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up development Python ${{ matrix.python-version }}
      if: endsWith(matrix.python-version, '-dev')
      uses: deadsnakes/action@v2.1.1
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      env:
        PIP_CONSTRAINT: ${{ runner.temp }}/constraints.txt
      run: |
        python -c "import os; from pathlib import Path; Path(os.environ['PIP_CONSTRAINT']).write_text('beautifulsoup4==4.12.2\n')"
        python -m pip install --upgrade pip setuptools build tox coverage
    - name: Test
      env:
        PIP_CONSTRAINT: ${{ runner.temp }}/constraints.txt
      run: |
        python -m tox --override 'testenv.commands=pytest -k "not test_contains_iframe and not test_contains_warn and not test_iframe and not test_no_iframe and not test_root_iframe"' --override 'testenv:nolxml.commands=pytest -k "not test_contains_iframe and not test_contains_warn and not test_iframe and not test_no_iframe and not test_root_iframe"' --override 'testenv:nohtml5lib.commands=pytest -k "not test_contains_iframe and not test_contains_warn and not test_iframe and not test_no_iframe and not test_root_iframe"' ${{ inputs.test-filter }}


  lint:
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.9]

    env:
      TOXENV: lint

    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools tox
    - name: Lint
      run: |
        python -m tox
